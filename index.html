<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mon Hub" />
  <title>Mon Hub — Tous mes projets</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="status-bar">
    <span id="clock"></span>
    <span id="battery">🔋 100%</span>
  </div>

  <div id="wallpaper" class="wallpaper"></div>

  <main id="home">
    <header id="header">
      <h1 id="title">Mon Hub</h1>
      <p id="subtitle">Tous mes projets, centralisés</p>
    </header>

    <section id="grid" aria-label="Applications"></section>

    <footer id="dock"></footer>
  </main>

  <!-- Overlay dossier retiré : plus de dossiers -->

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Bouton édition -->
  <button id="edit-btn" class="edit-btn" aria-label="Réorganiser">✏️</button>

  <!-- Bouton réglages -->
  <button id="settings-btn" class="settings-btn" aria-label="Réglages">⚙️</button>

  <!-- Modale de confirmation suppression -->
  <div id="confirm-overlay" class="confirm-overlay hidden">
    <div class="confirm-card">
      <div class="confirm-emoji">👁️</div>
      <div class="confirm-title">Masquer «&nbsp;<span id="confirm-name"></span>&nbsp;»&nbsp;?</div>
      <div class="confirm-sub">Elle sera retirée de l'écran. Tu pourras la ré-afficher dans ⚙️ Réglages.</div>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="confirm-btn cancel">Annuler</button>
        <button id="confirm-ok" class="confirm-btn danger">Masquer</button>
      </div>
    </div>
  </div>

  <!-- Panneau réglages -->
  <div id="settings-overlay" class="settings-overlay hidden">
    <div class="settings-card">
      <div class="settings-header">
        <span>⚙️ Réglages</span>
        <button id="settings-close" aria-label="Fermer">✕</button>
      </div>
      <div class="settings-sub">Affiche ou masque les apps du hub</div>
      <div id="settings-list"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
